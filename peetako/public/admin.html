<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Peetako — Report review</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0; background: #FFF8EC; color: #1B1A2E; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 24px; }
  input { font: inherit; padding: 10px; width: 100%; box-sizing: border-box; border: 2px solid #1B1A2E; border-radius: 8px; }
  button { font: inherit; font-weight: 700; padding: 10px 14px; border: 2px solid #1B1A2E; border-radius: 8px; cursor: pointer; background: #fff; min-height: 44px; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .card { background: #fff; border: 2px solid #1B1A2E; border-radius: 12px; padding: 12px; margin: 10px 0; }
  .text { font-size: 22px; font-weight: 800; word-break: break-word; }
  .meta { color: #5B587A; font-size: 14px; }
  .keep { background: #BBF7D0; } .remove { background: #FECDD3; }
  .msg { font-weight: 700; } .error { color: #9F1239; }
</style>
</head>
<body>
<main>
  <h1>Report review</h1>
  <p>Reported names and Tier 7 titles are hidden from other players until you decide. <b>Keep</b> shows the text again and stops further reports of it. <b>Remove</b> replaces a name with “Peetako” or deletes a title.</p>
  <form id="login" class="row">
    <input id="token" type="password" autocomplete="current-password" placeholder="Admin token (ADMIN_TOKEN secret)" aria-label="Admin token" required>
    <button type="submit">Open</button>
  </form>
  <p id="msg" class="msg" role="status" aria-live="polite"></p>
  <div id="list"></div>
</main>
<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let token = '';
try { token = sessionStorage.getItem('ptk_admin') || ''; } catch { /* ignore */ }

async function call(path, body) {
  const res = await fetch(path, { method: body ? 'POST' : 'GET', headers: { authorization: `Bearer ${token}`, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
  return data;
}
async function load() {
  $('#msg').textContent = 'Loading…'; $('#msg').className = 'msg';
  try {
    const { reports } = await call('/api/admin/reports');
    $('#login').hidden = true;
    $('#msg').textContent = reports.length ? `${reports.length} open report${reports.length === 1 ? '' : 's'}` : 'No open reports. 🎉';
    $('#list').innerHTML = reports.map((r) => `
      <div class="card">
        <div class="meta">${r.field === 'name' ? 'Pet name' : 'Tier 7 title'} · <a href="/p/${encodeURIComponent(r.callCode)}" target="_blank" rel="noopener">${esc(r.callCode)}</a> · T${r.tier} ${esc(r.type)} · reported by ${esc(r.reporter || '?')} · ${new Date(r.at).toLocaleString()}</div>
        <p class="text">${esc(r.text)}</p>
        <div class="row"><button class="keep" data-id="${r.id}" data-d="approve">Keep</button><button class="remove" data-id="${r.id}" data-d="reject">Remove</button></div>
      </div>`).join('');
  } catch (e) {
    $('#login').hidden = false; $('#list').innerHTML = '';
    $('#msg').textContent = e.message; $('#msg').className = 'msg error';
  }
}
$('#login').addEventListener('submit', (e) => {
  e.preventDefault();
  token = $('#token').value.trim();
  try { sessionStorage.setItem('ptk_admin', token); } catch { /* ignore */ }
  load();
});
$('#list').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  b.disabled = true;
  try { await call('/api/admin/resolve', { id: Number(b.dataset.id), decision: b.dataset.d }); load(); }
  catch (err) { $('#msg').textContent = err.message; $('#msg').className = 'msg error'; b.disabled = false; }
});
if (token) load(); else $('#msg').textContent = '';
</script>
</body>
</html>
